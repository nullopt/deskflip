name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect third-party licence notices
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-NOTICES.txt
      - name: Package
        shell: pwsh
        run: >
          Compress-Archive -DestinationPath deskflip.zip -Path
          target/release/deskflip.exe, LICENSE, README.md, THIRD-PARTY-NOTICES.txt,
          licenses/Inter-LICENSE.txt, licenses/IBMPlexMono-LICENSE.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" deskflip.zip --title "${{ github.ref_name }}" --generate-notes
