# Which licences Deskflip's dependencies may carry. `cargo about generate` fails on any other,
# so a new dependency with an unexpected licence is noticed at release time.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc"]
