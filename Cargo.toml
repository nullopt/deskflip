[package]
name = "deskflip"
version = "0.1.0"
edition = "2024"
description = "Switch monitor inputs and Windows display layout together, from the tray or a hotkey"
license = "MIT"
repository = "https://github.com/nullopt/deskflip"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b", default-features = false, features = ["accessibility", "embedded-fonts"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b", default-features = false }
global-hotkey = "0.10.0"
log = { version = "0.4.35", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri-winrt-notification = "0.8.1"
thiserror = "2.0.21"
toml = "1.2.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.100.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

# Rune builds against lightly patched copies of these crates, and Cargo does not inherit patches
# from a dependency. Keep every `rev` here identical to the one on `rune` above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "6d17f90c5adb0328f1e1d37c97e6e67d494c218b" }
