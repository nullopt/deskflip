[package]
name = "deskflip"
version = "0.1.0"
edition = "2024"
description = "Switch monitor inputs and Windows display layout together, from the tray or a hotkey"
license = "MIT"
repository = "https://github.com/nullopt/deskflip"

[dependencies]
global-hotkey = "0.10.0"
log = { version = "0.4.35", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
windows = { version = "0.62.2", features = ["Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Security"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
